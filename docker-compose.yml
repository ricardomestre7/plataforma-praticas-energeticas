services:
  # Vertical 01: 33 Protocolos Integrativos Avançados (PIA)
  pia-33:
    build:
      context: ./verticals/01-pia
      dockerfile: Dockerfile
    container_name: iria-01-pia
    restart: unless-stopped
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - iria-network

  # Vertical 02: Sistema Reiki Usui Luminar®
  reiki-luminar:
    build:
      context: ./verticals/02-reiki-usui-luminar
      dockerfile: Dockerfile
    container_name: iria-02-reiki-usui-luminar
    restart: unless-stopped
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - iria-network

  # Vertical 03: Formações Quânticas & Biofield RPQ36
  quantica-avancada:
    build:
      context: ./verticals/03-quantica-avancada
      dockerfile: Dockerfile
    container_name: iria-03-quantica-avancada
    restart: unless-stopped
    ports:
      - "8083:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - iria-network

  # Vertical 04: Vertical IRIA Integrative Therapists
  integrative-therapists:
    build:
      context: ./verticals/04-integrative-therapists
      dockerfile: Dockerfile
    container_name: iria-04-integrative-therapists
    restart: unless-stopped
    ports:
      - "8084:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - iria-network

  # Vertical 05: 6 Sistemas Essenciais Naturalis
  naturalis-sistemas:
    build:
      context: ./verticals/05-naturalis
      dockerfile: Dockerfile
    container_name: iria-05-naturalis
    restart: unless-stopped
    ports:
      - "8085:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - iria-network

  # Plataforma Central Soberana & Hub
  plataforma-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iria-central-hub
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
  # Vertical 06: Formação BioCoherent (formacao.biocoherent.com)
  formacao-biocoherent:
    build:
      context: ./verticals/06-formacao-biocoherent
      dockerfile: Dockerfile
    container_name: iria-06-formacao-biocoherent
    restart: unless-stopped
    ports:
      - "8086:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - iria-network

networks:
  iria-network:
    driver: bridge
