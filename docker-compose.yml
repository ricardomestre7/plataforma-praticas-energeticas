version: '3.8'

# ==============================================================================
# IRIA KNOWLEDGE CONTAINERS — DOCKER COMPOSE ORCHESTRATION
# Autor: Mestre Ricardo Rogério Pereira | Safe Creative #2610157331452
# Qualidade Europeia a Nível Global • Cylinder Global Academy
