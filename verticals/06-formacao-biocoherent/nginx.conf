server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Otimização de I/O para streaming de vídeo MP4 e WebM
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip para recursos estáticos textuais
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Headers de Segurança e Identificação Soberana
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Sovereign-Cert "Safe-Creative-2610157331452" always;

    # Roteamento SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Suporte a Byte-Range Requests para Vídeos MP4 (Seek sem travar)
    location ~* \.(mp4|m4v|webm|ogg|mp3|wav)$ {
        mp4;
        mp4_buffer_size     1m;
        mp4_max_buffer_size 10m;
        add_header Accept-Ranges bytes;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Cache de ficheiros estáticos (CSS, JS, Imagens, Fontes, PDFs)
    location ~* \.(css|js|jpg|jpeg|png|webp|svg|gif|ico|woff|woff2|ttf|eot|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Desabilitar logs de favicon e robots
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Bloquear acesso a ficheiros ocultos
    location ~ /\. {
        deny all;
    }
}
